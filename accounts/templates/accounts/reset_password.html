{% extends "layouts/main_layout.html" %}
{% block title %}Reset Password{% endblock %}
{% block page_content %}

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    font-family: 'Poppins', sans-serif;
}

/* CENTER RESET */
.reset-wrapper {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

/* CARD */
.reset-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 18px 36px rgba(0,0,0,0.25);
    animation: fadeInUp 0.6s ease;
    transition: transform 0.3s ease;
}
.reset-card:hover {
    transform: translateY(-4px);
}

/* ICON */
.icon {
    font-size: 42px;
    color: #2563eb; /* same blue as login */
    text-align: center;
    margin-bottom: 12px;
}

/* TITLE */
.title {
    text-align: center;
    font-weight: bold;
    font-size: 22px;
    margin-bottom: 5px;
}

/* SUBTITLE */
.subtitle {
    text-align: center;
    font-size: 13px;
    color: gray;
    margin-bottom: 20px;
}

/* INPUT */
.form-control {
    border-radius: 10px;
    padding: 12px;
    transition: all 0.3s ease;
}
.form-control:focus {
    border: 2px solid #2563eb;
    box-shadow: 0 0 8px rgba(37,99,235,0.3);
}

/* BUTTON */
.btn-reset {
    background: linear-gradient(90deg, #2563eb, #1d4ed8);
    color: white;
    width: 100%;
    border-radius: 10px;
    padding: 12px;
    font-weight: 600;
    transition: all 0.3s ease;
}
.btn-reset:hover {
    background: linear-gradient(90deg, #1d4ed8, #1e40af);
    transform: translateY(-2px);
}

/* LINKS */
.extra-links {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
}
.extra-links a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
}
.extra-links a:hover {
    color: #1d4ed8;
    text-decoration: underline;
}

/* ANIMATION */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<div class="reset-wrapper">
    <div class="reset-card">

        <div class="icon">
            <i class="bi bi-shield-lock"></i>
        </div>

        <div class="title">Reset Password</div>
        <div class="subtitle">Enter your email to receive reset instructions</div>

        <form method="POST">
            {% csrf_token %}
            <input class="form-control mb-3" name="email" placeholder="Enter Email" required>
            <button class="btn btn-reset" type="submit">Send Password</button>
        </form>

        <!-- Extra Links -->
        <div class="extra-links">
            <p><a href="{% url 'login' %}">Back to Login</a></p>
            <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
        </div>
    </div>
</div>

{% endblock %}
