{% extends "layouts/main_layout.html" %}
{% block title %}Change Password{% endblock %}
{% block page_content %}

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    font-family: 'Poppins', sans-serif;
}

/* CENTER CHANGE PASSWORD */
.change-wrapper {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

/* CARD */
.change-card {
    width: 100%;
    max-width: 360px; /* compact width */
    background: #fff;
    border-radius: 14px;
    padding: 24px; /* reduced padding */
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    animation: fadeInUp 0.6s ease;
    transition: transform 0.3s ease;
}
.change-card:hover {
    transform: translateY(-4px);
}

/* ICON */
.icon {
    font-size: 36px;
    color: #2563eb; /* same blue as login */
    text-align: center;
    margin-bottom: 10px;
}

/* TITLE */
.title {
    text-align: center;
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 4px;
}

/* SUBTITLE */
.subtitle {
    text-align: center;
    font-size: 12px;
    color: gray;
    margin-bottom: 15px;
}

/* INPUT */
.form-control {
    border-radius: 8px;
    padding: 10px;
    transition: all 0.3s ease;
}
.form-control:focus {
    border: 2px solid #2563eb;
    box-shadow: 0 0 6px rgba(37,99,235,0.3);
}

/* BUTTON */
.btn-change {
    background: linear-gradient(90deg, #2563eb, #1d4ed8);
    color: white;
    width: 100%;
    border-radius: 8px;
    padding: 10px;
    font-weight: 600;
    transition: all 0.3s ease;
}
.btn-change:hover {
    background: linear-gradient(90deg, #1d4ed8, #1e40af);
    transform: translateY(-2px);
}

/* ANIMATION */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<div class="change-wrapper">
    <div class="change-card">

        <div class="icon">
            <i class="bi bi-lock-fill"></i>
        </div>

        <div class="title">Change Password</div>
        <div class="subtitle">Update your account security</div>

        <form method="POST">
            {% csrf_token %}
            <input class="form-control mb-2" type="password" name="old_password" placeholder="Old Password" required>
            <input class="form-control mb-2" type="password" name="new_password" placeholder="New Password" required>
            <input class="form-control mb-3" type="password" name="confirm_password" placeholder="Confirm Password" required>

            <button class="btn btn-change" type="submit">Update Password</button>
        </form>

    </div>
</div>

{% endblock %}
