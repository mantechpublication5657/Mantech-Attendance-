{% extends "layouts/main_layout.html" %}

{% block title %}Check Your Email{% endblock %}

{% block page_content %}

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    font-family: 'Poppins', sans-serif;
}
.login-wrapper {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}
.login-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    text-align: center;
}
.icon {
    font-size: 36px;
    color: #16a34a;
    margin-bottom: 10px;
}
.title {
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 4px;
}
.subtitle {
    font-size: 13px;
    color: gray;
    margin-bottom: 18px;
}
.extra-links a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
}
.extra-links a:hover {
    text-decoration: underline;
}
</style>

<div class="login-wrapper">
    <div class="login-card">
        <div class="icon"><i class="bi bi-envelope-check"></i></div>
        <div class="title">Check Your Email</div>
        <div class="subtitle">
            If an account exists with that email address, we've sent a link to reset your password.
            The link expires shortly, so please use it soon.
        </div>
        <div class="extra-links">
            <p><a href="{% url 'login' %}">Back to Login</a></p>
        </div>
    </div>
</div>

{% endblock %}
