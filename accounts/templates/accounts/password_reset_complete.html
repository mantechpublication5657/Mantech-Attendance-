{% extends "layouts/main_layout.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block page_content %}

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    font-family: 'Poppins', sans-serif;
}
.login-wrapper {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}
.login-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    text-align: center;
}
.icon {
    font-size: 36px;
    color: #16a34a;
    margin-bottom: 10px;
}
.title {
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 4px;
}
.subtitle {
    font-size: 13px;
    color: gray;
    margin-bottom: 18px;
}
.btn-login {
    background: linear-gradient(90deg, #2563eb, #1d4ed8);
    color: white;
    width: 100%;
    border-radius: 8px;
    padding: 10px;
    font-weight: 600;
    display: block;
    text-decoration: none;
}
.btn-login:hover {
    color: white;
}
</style>

<div class="login-wrapper">
    <div class="login-card">
        <div class="icon"><i class="bi bi-check-circle"></i></div>
        <div class="title">Password Reset Complete</div>
        <div class="subtitle">Your password has been changed successfully. You can now log in with your new password.</div>
        <a href="{% url 'login' %}" class="btn-login">Continue to Login</a>
    </div>
</div>

{% endblock %}
