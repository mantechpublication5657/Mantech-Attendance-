{% extends "layouts/main_layout.html" %}

{% block title %}Reset Password{% endblock %}

{% block page_content %}

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    font-family: 'Poppins', sans-serif;
}
.login-wrapper {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}
.login-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    animation: fadeInUp 0.6s ease;
}
.icon {
    font-size: 36px;
    color: #2563eb;
    text-align: center;
    margin-bottom: 10px;
}
.title {
    text-align: center;
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 4px;
}
.subtitle {
    text-align: center;
    font-size: 13px;
    color: gray;
    margin-bottom: 18px;
}
.form-control {
    border-radius: 8px;
    padding: 10px;
}
.form-control:focus {
    border: 2px solid #2563eb;
    box-shadow: 0 0 6px rgba(37,99,235,0.3);
}
.btn-login {
    background: linear-gradient(90deg, #2563eb, #1d4ed8);
    color: white;
    width: 100%;
    border-radius: 8px;
    padding: 10px;
    font-weight: 600;
}
.btn-login:hover {
    background: linear-gradient(90deg, #1d4ed8, #1e40af);
    color: white;
}
.extra-links {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
}
.extra-links a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
}
.extra-links a:hover {
    text-decoration: underline;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<div class="login-wrapper">
    <div class="login-card">

        <div class="icon">
            <i class="bi bi-key"></i>
        </div>

        <div class="title">Forgot Password?</div>
        <div class="subtitle">Enter your registered email address and we'll send you a link to reset your password.</div>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <button class="btn btn-login" type="submit">Send Reset Link</button>
        </form>

        <div class="extra-links">
            <p><a href="{% url 'login' %}">Back to Login</a></p>
        </div>
    </div>
</div>

{% endblock %}
