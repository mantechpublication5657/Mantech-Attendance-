<!-- SEARCH + FILTER -->
<form method="GET" class="search-bar">

    <div class="row g-3 align-items-end">

        <!-- Username Search -->
        <div class="col-lg-3 col-md-6 col-12">
            <label class="form-label fw-semibold">
                Search Employee
            </label>
            <div class="input-group">

                <span class="input-group-text search-icon-wrap">

                    <i class="fa-solid fa-search text-muted"></i>

                </span>

                <input type="text"
                       name="q"
                       value="{{ request.GET.q }}"
                       class="form-control search-input"
                       placeholder="Search by Username/Emp ID">

            </div>

        </div>

        <!-- Month Filter -->
        <div class="col-lg-3 col-md-6 col-12">

            <label class="form-label fw-semibold">
                Month
            </label>

            <select name="month" class="form-select">

                <option value="1" {% if current_month == 1 %}selected{% endif %}>January</option>
                <option value="2" {% if current_month == 2 %}selected{% endif %}>February</option>
                <option value="3" {% if current_month == 3 %}selected{% endif %}>March</option>
                <option value="4" {% if current_month == 4 %}selected{% endif %}>April</option>
                <option value="5" {% if current_month == 5 %}selected{% endif %}>May</option>
                <option value="6" {% if current_month == 6 %}selected{% endif %}>June</option>
                <option value="7" {% if current_month == 7 %}selected{% endif %}>July</option>
                <option value="8" {% if current_month == 8 %}selected{% endif %}>August</option>
                <option value="9" {% if current_month == 9 %}selected{% endif %}>September</option>
                <option value="10" {% if current_month == 10 %}selected{% endif %}>October</option>
                <option value="11" {% if current_month == 11 %}selected{% endif %}>November</option>
                <option value="12" {% if current_month == 12 %}selected{% endif %}>December</option>

            </select>

        </div>

        <!-- Year Filter -->
        <div class="col-lg-3 col-md-6 col-12">

            <label class="form-label fw-semibold">
                Year
            </label>

            <input type="number"
                   name="year"
                   value="{{ current_year }}"
                   class="form-control"
                   placeholder="Enter year">

        </div>

        <!-- Search Button -->
        <div class="col-lg-3 col-md-6 col-12">

            <button type="submit"
                    class="btn search-btn">

                Search

            </button>

        </div>

    </div>

</form>

<style>

/* ===================================
   FULL WIDTH MODERN SEARCH FORM
=================================== */

.table-filter-wrapper{
    width:100%;
    padding:0;
}

.search-bar{
    width:100%;
    display:block;
    background:#fff;
    padding:22px;
    margin:0;
    border-bottom:1px solid #ececec;
    position:relative;
    overflow:hidden;
}

/* TOP BORDER */

.search-bar::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:4px;
    background:linear-gradient(
        90deg,
        #dc3545,
        #ff5c7c,
        #ff7b54
    );
}

/* REMOVE BOOTSTRAP EXTRA SPACE */

.search-bar .row{
    margin-left:0;
    margin-right:0;
}

/* LABELS */

.search-bar .form-label{
    font-size:13px;
    font-weight:600;
    color:#444;
    margin-bottom:7px;
    display:block;
}

/* INPUTS */

.search-bar .form-control,
.search-bar .form-select{
    width:100%;
    height:50px;
    border-radius:14px;
    border:1px solid #d8d8d8;
    background:#fafafa;
    font-size:14px;
    font-weight:500;
    padding:10px 15px;
    transition:all 0.3s ease;
    box-shadow:none;
}

/* INPUT PLACEHOLDER */

.search-bar .form-control::placeholder{
    color:#999;
    font-size:13px;
}

/* INPUT FOCUS */

.search-bar .form-control:focus,
.search-bar .form-select:focus{
    background:#fff;
    border-color:#dc3545;
    box-shadow:0 0 0 0.15rem rgba(220,53,69,0.12);
}

/* SEARCH ICON */

.search-icon-wrap{
    background:#fafafa;
    border:1px solid #d8d8d8;
    border-right:none;
    border-radius:14px 0 0 14px !important;
    padding:0 16px;
}

.search-icon-wrap i{
    font-size:14px;
    color:#999;
}

/* SEARCH INPUT */

.search-input{
    border-left:none !important;
    border-radius:0 14px 14px 0 !important;
}

/* BUTTON */

.search-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #dc3545,
        #b02a37
    );
    color:#fff;
    font-size:14px;
    font-weight:600;
    padding:0 20px;
    white-space:nowrap;
    transition:all 0.3s ease;
    box-shadow:0 6px 15px rgba(220,53,69,0.18);
}

/* BUTTON HOVER */

.search-btn:hover{
    background:linear-gradient(
        135deg,
        #c82333,
        #921925
    );
    color:#fff;
    transform:translateY(-1px);
}

/* INPUT GROUP */

.search-bar .input-group{
    flex-wrap:nowrap;
    width:100%;
}

/* RESPONSIVE */

@media(max-width:992px){

    .search-bar{
        padding:18px;
    }

}

@media(max-width:768px){

    .search-bar{
        padding:16px;
    }

    .search-bar .form-control,
    .search-bar .form-select,
    .search-btn{
        height:46px;
        font-size:13px;
    }

}

@media(max-width:576px){

    .search-bar{
        padding:14px;
    }

    .search-bar .form-label{
        font-size:12px;
    }

    .search-bar .form-control,
    .search-bar .form-select{
        border-radius:12px;
    }

    .search-icon-wrap{
        border-radius:12px 0 0 12px !important;
    }

    .search-input{
        border-radius:0 12px 12px 0 !important;
    }

    .search-btn{
        border-radius:12px;
        font-size:13px;
    }

}

</style>
