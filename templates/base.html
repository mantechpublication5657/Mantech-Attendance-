<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>{% block title %}{% endblock title %} | Mantech HRMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.png' %}">


    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- For Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- For NProgress -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css"/>
</head>


{% block extra_head %}{% endblock %}
<body>

{% block content %}{% endblock %}
<script>
// ── Live date
(function(){
    const el = document.getElementById('live-date');
    if(!el) return;
    const d = new Date();
    el.textContent = d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
})();

// ── Sidebar toggle (mobile)
function toggleSidebar(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
}

// ── Attendance bar chart
(function(){
    const data = [
        {day:'Mon', present:218, leave:12},
        {day:'Tue', present:225, leave:8},
        {day:'Wed', present:230, leave:10},
        {day:'Thu', present:221, leave:14},
        {day:'Fri', present:232, leave:8},
        {day:'Sat', present:140, leave:5},
        {day:'Sun', present:0,   leave:0},
    ];
    const total = 247;
    const container = document.getElementById('chartBars');
    if(!container) return;

    container.innerHTML = data.map(d => {
        const pPct = Math.round((d.present/total)*100);
        const lPct = Math.round((d.leave/total)*100);
        const isToday = d.day === 'Fri';
        return `
        <div class="bar-group">
            <div class="bar-wrap" style="position:relative;">
                <div class="bar-fill" style="
                    height:${pPct}%;
                    background:${isToday
                        ? 'linear-gradient(180deg,#38bdf8,#2563eb)'
                        : 'linear-gradient(180deg,#93c5fd,#3b82f6)'};
                    position:relative;
                "></div>
                ${d.leave>0 ? `<div style="position:absolute;bottom:${pPct}%;left:0;right:0;height:${lPct}%;background:linear-gradient(180deg,#fbbf24,#f59e0b);"></div>` : ''}
            </div>
            <span class="bar-label" style="${isToday?'color:var(--blue);font-weight:700;':''}">${d.day}</span>
        </div>`;
    }).join('');
})();


<!-- Dynamic Greeting -->
 function updateGreeting() {

        const hour = new Date().getHours();

        let greeting = "";

        if (hour >= 5 && hour < 12) {
            greeting = "Good Morning,";
        }
        else if (hour >= 12 && hour < 17) {
            greeting = "Good Afternoon,";
        }
        else {
            greeting = "Good Evening,";
        }

        document.getElementById("greeting-text").innerText = greeting;
    }

    updateGreeting();
</script>


<!-- For top progressing bar -->
<!-- Before </body> -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>
<script>
  NProgress.configure({ showSpinner: false, speed: 400, trickleSpeed: 200 });

  // Start bar on every link click and form submit
  document.addEventListener('click', function(e) {
    const link = e.target.closest('a[href]');
    if (link && !link.target && !link.href.startsWith('#') && !link.href.startsWith('javascript')) {
      NProgress.start();
    }
  });

  document.addEventListener('submit', function() {
    NProgress.start();
  });

  // Finish when page fully loads
  window.addEventListener('load', function() {
    NProgress.done();
  });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}

{% include "mantech_chatbot/chatbot_widget.html" %}
</body>
</html>
